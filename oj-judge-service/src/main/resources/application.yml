server:
  # 这个服务不对外提供 HTTP。
  # 它的生命由 RabbitMQ 监听器撑着：有任务就干活，没任务就等着。
  port: 8122

spring:
  application:
    name: oj-judge-service

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    # 发布确认：消息没真正到 RabbitMQ 就抛异常，而不是静默丢失。
    # 判题任务丢了用户会一直转圈，宁可报错也好过无声无息。
    publisher-confirm-type: correlated
    publisher-returns: true

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

logging:
  level:
    com.ojjudge: info

judge:
  sandbox:
    # 宿主机侧的兜底宽限（毫秒），叠加在整个运行阶段预算之上。
    # 注意：它不决定用户是否超时 —— 用户代码的时限由容器内看门狗精确控制，
    # 这里只是留给容器启停和文件读写的余量，防止正常判题被宿主机误杀。
    timeout-buffer-ms: 5000
    # 单用例硬超时上限（毫秒），防止题目配了荒谬时限长期占住判题线程
    max-time-per-case-ms: 10000
    # 编译阶段超时（毫秒）。编译不受题目时限约束，单独给一个宽松的值。
    # Go 冷缓存时要连着编译一整张标准库依赖图，30 秒不够看。
    compile-timeout-ms: 60000
    # 容器内存硬上限（MB）—— 这是「运行」阶段的默认值
    max-memory-mb: 256
    # 编译阶段的内存上限（MB）。编译器开销和用户程序不是一个量级，
    # 拿 256MB 去限制编译器，Go 会先把自己饿死。
    compile-memory-mb: 512
    # 容器可用的 CPU 核数上限。既防止单条提交吃满所有核，
    # 也让同一份代码的耗时在不同机器上更可比。
    # 注意：它限制不了 Go 的构建并行度（Go 1.22 不读 cgroup quota），
    # 那个是在 LanguageEnum.GO 的编译命令里用 GOMAXPROCS 限制的。
    max-cpus: 1
    # 容器内进程+线程数上限。数的是 cgroup 的 task 数，线程也算。
    # 调到 512 是为了 Go：它会按宿主机核数并发 fork 十几个 compile，
    # 之前设 64 时被顶破，于是所有 fork 返回 EAGAIN，「Go 怎么提交都过不了」。
    # 512 仍然挡得住 fork 炸弹 —— 那东西指数级翻倍，几毫秒就撞到上限。
    pids-limit: 512
    # 判题临时目录的根。留空 = 系统临时目录（Windows 上在 C 盘）。
    # 想避开 C 盘就填 E 盘路径，比如 E:/oj-judge-tmp —— 只需把 E 盘
    # 加进 Docker Desktop 的 File sharing，C 盘不用共享。
    # 注意这里只放几 KB 的源码与用例，判完即删，不吃磁盘。
    # 容器池会把这个根目录整体挂进常驻容器，所以路径要稳定。
    work-dir:
    # 容器池：预起常驻容器，用 docker exec 判题，省掉每次创建容器的开销。
    # 借不到容器（池满 / Docker 没起）会自动退回一次性容器，不影响正确性。
    pool:
      enabled: true
      # 每个镜像最多常驻几个容器。
      # ⚠️ 实际容器总数 = 语言数 × size。现在 4 种语言 × 2 = 8 个常驻容器，
      # 按每个空闲占 30~80MB 算，大概 300~600MB 常驻内存。
      # 内存紧张就把它降到 1（变 4 个），代价是并发判题时更容易退回一次性容器。
      # 判题线程池最大是 4，所以 size 超过 2 基本没意义。
      size: 2
      # 应用启动后就异步把容器建好、并把工具链缓存预热。
      # 关掉的话第一次提交才创建，第一次判题会明显慢（Go 尤其明显）。
      prewarm: true
