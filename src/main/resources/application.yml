server:
  port: 8121

spring:
  application:
    name: oj-judge

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oj?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      # 刷新令牌、访问令牌黑名单都存在 db0
      database: 0
      timeout: 5s

  servlet:
    multipart:
      max-file-size: 10MB

  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-not-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== JWT 配置 =====
jwt:
  # HMAC 密钥，长度必须 >= 32 字节（256 bit）。生产环境务必替换并通过环境变量注入
  secret: oj-judge-access-and-refresh-token-signing-secret-key-please-change-me
  # Access Token 有效期（毫秒）：15 分钟 = 15 * 60 * 1000
  access-expiration: 900000
  # Refresh Token 有效期（毫秒）：14 天 = 14 * 24 * 60 * 60 * 1000
  refresh-expiration: 1209600000
  # Refresh Token 下发的 Cookie 名称
  refresh-cookie-name: refresh_token
  # Cookie 的 Path，必须能覆盖 /api/user/refresh、/api/user/logout
  refresh-cookie-path: /api/user
  # 本地 http 调试需为 false；上 https 后改成 true
  refresh-cookie-secure: false

# ===== CORS 白名单（前端 dev server） =====
cors:
  # ⚠️ 这里必须包含前端实际运行的端口，否则浏览器 CORS 预检会被拒，
  #    表现是「所有接口都失败、页面一片空白」且控制台只有 CORS 报错，极难定位。
  # 注意：@Value 注入 List<String> 只认**逗号分隔字符串**，
  # 写成 YAML 列表（- xxx）会导致启动时 Could not resolve placeholder
  allowed-origins: http://localhost:8080,http://localhost:8081,http://localhost:5173

logging:
  level:
    com.ojjudge: info

judge:
  sandbox:
    # 宿主机侧的兜底宽限（毫秒），叠加在整个运行阶段预算之上。
    # 注意：它不决定用户是否超时 —— 用户代码的时限由容器内看门狗精确控制，
    # 这里只是留给容器启停和文件读写的余量，防止正常判题被宿主机误杀。
    timeout-buffer-ms: 5000
    # 单用例硬超时上限（毫秒），防止题目配了荒谬时限长期占住判题线程
    max-time-per-case-ms: 10000
    # 编译阶段超时（毫秒）。编译不受题目时限约束，单独给一个宽松的值。
    # Go 冷缓存时要连着编译一整张标准库依赖图，30 秒不够看。
    compile-timeout-ms: 60000
    # 容器内存硬上限（MB）—— 这是「运行」阶段的默认值
    max-memory-mb: 256
    # 编译阶段的内存上限（MB）。编译器开销和用户程序不是一个量级，
    # 拿 256MB 去限制编译器，Go 会先把自己饿死。
    compile-memory-mb: 512
    # 容器可用的 CPU 核数上限。既防止单条提交吃满所有核，
    # 也让同一份代码的耗时在不同机器上更可比。
    # 注意：它限制不了 Go 的构建并行度（Go 1.22 不读 cgroup quota），
    # 那个是在 LanguageEnum.GO 的编译命令里用 GOMAXPROCS 限制的。
    max-cpus: 1
    # 容器内进程+线程数上限。数的是 cgroup 的 task 数，线程也算。
    # 调到 512 是为了 Go：它会按宿主机核数并发 fork 十几个 compile，
    # 之前设 64 时被顶破，于是所有 fork 返回 EAGAIN，「Go 怎么提交都过不了」。
    # 512 仍然挡得住 fork 炸弹 —— 那东西指数级翻倍，几毫秒就撞到上限。
    pids-limit: 512
    # 判题临时目录的根。留空 = 系统临时目录（Windows 上在 C 盘）。
    # 想避开 C 盘就填 E 盘路径，比如 E:/oj-judge-tmp —— 只需把 E 盘
    # 加进 Docker Desktop 的 File sharing，C 盘不用共享。
    # 注意这里只放几 KB 的源码与用例，判完即删，不吃磁盘。
    # 容器池会把这个根目录整体挂进常驻容器，所以路径要稳定。
    work-dir:
    # 容器池：预起常驻容器，用 docker exec 判题，省掉每次创建容器的开销。
    # 借不到容器（池满 / Docker 没起）会自动退回一次性容器，不影响正确性。
    pool:
      enabled: true
      # 每个镜像最多常驻几个容器。判题线程池最大 4，再多也只是闲着占内存
      size: 2
      # 应用启动后就异步把容器建好、并把工具链缓存预热。
      # 关掉的话第一次提交才创建，第一次判题会明显慢（Go 尤其明显）
      prewarm: true
