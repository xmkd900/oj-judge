server:
  port: 8121

spring:
  application:
    name: oj-judge

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oj?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      # 刷新令牌、访问令牌黑名单都存在 db0
      database: 0
      timeout: 5s

  servlet:
    multipart:
      max-file-size: 10MB

  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-not-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== JWT 配置 =====
jwt:
  # HMAC 密钥，长度必须 >= 32 字节（256 bit）。生产环境务必替换并通过环境变量注入
  secret: oj-judge-access-and-refresh-token-signing-secret-key-please-change-me
  # Access Token 有效期（毫秒）：15 分钟
  access-expiration: 10000
  # Refresh Token 有效期（毫秒）：14 天
  refresh-expiration: 30000
  # Refresh Token 下发的 Cookie 名称
  refresh-cookie-name: refresh_token
  # Cookie 的 Path，必须能覆盖 /api/user/refresh、/api/user/logout
  refresh-cookie-path: /api/user
  # 本地 http 调试需为 false；上 https 后改成 true
  refresh-cookie-secure: false

# ===== CORS 白名单（前端 dev server） =====
cors:
  allowed-origins:
    http://localhost:8080

logging:
  level:
    com.ojjudge: info
